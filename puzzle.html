<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fotoğraf Yapbozu 💕</title>
<a href="index.html?menu=true" class="back-button"  onclick="window.location.href='index.html#menuSection'" style="margin-top: 30px;" >🔙 Ana Menü</a>


  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/lucide.min.js"></script>

  <style>
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .animate-fadeIn { animation: fadeIn 0.8s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: translateY(0);} }
    
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      animation: confetti-fall 3s linear forwards;
      pointer-events: none;
    }
    
    @keyframes confetti-fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-400 via-red-400 to-purple-500 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    function LucideIcon({ name, size = 24, className = "" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!window.lucide || !lucide.icons) return;
        const ic = lucide.icons[name];
        if (!ic || !ic.toSvg) return;
        ref.current.innerHTML = ic.toSvg({ width: size, height: size });
      }, [name, size]);
      return <span ref={ref} className={className}></span>;
    }

    const Heart = (p) => <LucideIcon name="heart" {...p} />;
    const Trophy = (p) => <LucideIcon name="trophy" {...p} />;
    const RotateCcw = (p) => <LucideIcon name="rotate-ccw" {...p} />;
    const Info = (p) => <LucideIcon name="info" {...p} />;
    const Trash2 = (p) => <LucideIcon name="trash-2" {...p} />;
    const Upload = (p) => <LucideIcon name="upload" {...p} />;

    function PhotoPuzzle() {
      const [gameStarted, setGameStarted] = useState(false);
      const [difficulty, setDifficulty] = useState(null);
      const [image, setImage] = useState(null);
      const [pieces, setPieces] = useState([]);
      const [selectedPiece, setSelectedPiece] = useState(null);
      const [completed, setCompleted] = useState(false);
      const [showCelebration, setShowCelebration] = useState(false);
      const [showInstructions, setShowInstructions] = useState(true);
      const canvasRef = useRef(null);
      const paletteRef = useRef(null);
      const fileInputRef = useRef(null);

      const difficulties = {
        easy: { cols: 5, rows: 5, name: 'Kolay', pieces: 25, emoji: '😊' },
        medium: { cols: 7, rows: 7, name: 'Orta', pieces: 49, emoji: '🤔' },
        hard: { cols: 9, rows: 8, name: 'Zor', pieces: 72, emoji: '😤' }
      };

      const PIECE_SIZE = 70;
      const KNOB_RADIUS = 12;

      const gridDimensions = useMemo(() => {
        if (!difficulty) return { cols: 5, rows: 5 };
        return { 
          cols: difficulties[difficulty].cols, 
          rows: difficulties[difficulty].rows 
        };
      }, [difficulty]);

      const createConfetti = () => {
        const colors = ['#ff0000', '#ff69b4', '#ff1493', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981'];
        const confettiCount = 100;
        
        for (let i = 0; i < confettiCount; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.top = '-20px';
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDelay = Math.random() * 0.5 + 's';
          confetti.style.animationDuration = (Math.random() * 1 + 2) + 's';
          document.body.appendChild(confetti);
          
          setTimeout(() => confetti.remove(), 5000);
        }
      };

      const initializePuzzle = (img, cols, rows) => {
        const knobs = {};
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const id = `${row}-${col}`;
            knobs[id] = {
              top: row === 0 ? 0 : (knobs[`${row-1}-${col}`]?.bottom ? -knobs[`${row-1}-${col}`].bottom : (Math.random() > 0.5 ? 1 : -1)),
              right: col === cols - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
              bottom: row === rows - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
              left: col === 0 ? 0 : (knobs[`${row}-${col-1}`]?.right ? -knobs[`${row}-${col-1}`].right : (Math.random() > 0.5 ? 1 : -1))
            };
          }
        }

        const newPieces = [];
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const isEdge = row === 0 || row === rows - 1 || col === 0 || col === cols - 1;
            const id = `${row}-${col}`;
            newPieces.push({
              id,
              correctRow: row,
              correctCol: col,
              currentRow: isEdge ? row : null,
              currentCol: isEdge ? col : null,
              inPalette: !isEdge,
              isEdge,
              knobs: knobs[id],
              paletteX: null,
              paletteY: null
            });
          }
        }

        setPieces(newPieces.sort((a, b) => {
          if (a.isEdge && !b.isEdge) return -1;
          if (!a.isEdge && b.isEdge) return 1;
          return Math.random() - 0.5;
        }));
        setCompleted(false);
        setShowCelebration(false);
        setSelectedPiece(null);
      };

      const checkCompletion = (currentPieces) => {
        return currentPieces.every(piece =>
          !piece.inPalette &&
          piece.currentRow === piece.correctRow &&
          piece.currentCol === piece.correctCol
        );
      };

      const createPiecePath = (ctx, x, y, size, knobs) => {
        ctx.beginPath();
        ctx.moveTo(x, y);
        if (knobs.top) {
          ctx.lineTo(x + size * 0.3, y);
          ctx.bezierCurveTo(
            x + size * 0.35, y + (knobs.top > 0 ? -KNOB_RADIUS : KNOB_RADIUS),
            x + size * 0.65, y + (knobs.top > 0 ? -KNOB_RADIUS : KNOB_RADIUS),
            x + size * 0.7, y
          );
        }
        ctx.lineTo(x + size, y);
        if (knobs.right) {
          ctx.lineTo(x + size, y + size * 0.3);
          ctx.bezierCurveTo(
            x + size + (knobs.right > 0 ? KNOB_RADIUS : -KNOB_RADIUS), y + size * 0.35,
            x + size + (knobs.right > 0 ? KNOB_RADIUS : -KNOB_RADIUS), y + size * 0.65,
            x + size, y + size * 0.7
          );
        }
        ctx.lineTo(x + size, y + size);
        if (knobs.bottom) {
          ctx.lineTo(x + size * 0.7, y + size);
          ctx.bezierCurveTo(
            x + size * 0.65, y + size + (knobs.bottom > 0 ? KNOB_RADIUS : -KNOB_RADIUS),
            x + size * 0.35, y + size + (knobs.bottom > 0 ? KNOB_RADIUS : -KNOB_RADIUS),
            x + size * 0.3, y + size
          );
        }
        ctx.lineTo(x, y + size);
        if (knobs.left) {
          ctx.lineTo(x, y + size * 0.7);
          ctx.bezierCurveTo(
            x + (knobs.left > 0 ? -KNOB_RADIUS : KNOB_RADIUS), y + size * 0.65,
            x + (knobs.left > 0 ? -KNOB_RADIUS : KNOB_RADIUS), y + size * 0.35,
            x, y + size * 0.3
          );
        }
        ctx.lineTo(x, y);
        ctx.closePath();
      };

      const drawPiece = (ctx, piece, x, y, cols, rows, isSelected = false) => {
        if (!image) return;
        const srcX = (piece.correctCol * image.width) / cols;
        const srcY = (piece.correctRow * image.height) / rows;
        const srcW = image.width / cols;
        const srcH = image.height / rows;

        ctx.save();
        createPiecePath(ctx, x, y, PIECE_SIZE, piece.knobs);
        ctx.clip();
        ctx.drawImage(image, srcX, srcY, srcW, srcH, x, y, PIECE_SIZE, PIECE_SIZE);
        ctx.restore();

        ctx.save();
        createPiecePath(ctx, x, y, PIECE_SIZE, piece.knobs);
        ctx.strokeStyle = isSelected ? '#8b5cf6' : 'rgba(0,0,0,0.4)';
        ctx.lineWidth = isSelected ? 4 : 2;
        ctx.stroke();
        if (isSelected) {
          ctx.shadowColor = 'rgba(139,92,246,0.5)';
          ctx.shadowBlur = 10;
          ctx.stroke();
        }
        ctx.restore();
      };

      const drawBoard = () => {
        if (!canvasRef.current || !image || !difficulty) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const { cols, rows } = gridDimensions;
        
        canvas.width = cols * PIECE_SIZE;
        canvas.height = rows * PIECE_SIZE;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f3f4f6';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#e5e7eb';
        ctx.lineWidth = 1;
        for (let i = 0; i <= cols; i++) {
          ctx.beginPath();
          ctx.moveTo(i * PIECE_SIZE, 0);
          ctx.lineTo(i * PIECE_SIZE, rows * PIECE_SIZE);
          ctx.stroke();
        }
        for (let i = 0; i <= rows; i++) {
          ctx.beginPath();
          ctx.moveTo(0, i * PIECE_SIZE);
          ctx.lineTo(cols * PIECE_SIZE, i * PIECE_SIZE);
          ctx.stroke();
        }

        pieces.forEach(piece => {
          if (!piece.inPalette && piece.currentRow !== null) {
            const x = piece.currentCol * PIECE_SIZE;
            const y = piece.currentRow * PIECE_SIZE;
            drawPiece(ctx, piece, x, y, cols, rows, selectedPiece?.id === piece.id);
          }
        });
      };

      const drawPalette = () => {
        if (!paletteRef.current || !image || !difficulty) return;
        const canvas = paletteRef.current;
        const ctx = canvas.getContext('2d');
        const { cols, rows } = gridDimensions;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const palettePieces = pieces.filter(p => p.inPalette);
        const palCols = 4;
        const padding = 10;

        palettePieces.forEach((piece, idx) => {
          const col = idx % palCols;
          const row = Math.floor(idx / palCols);
          const x = col * (PIECE_SIZE + padding) + padding;
          const y = row * (PIECE_SIZE + padding) + padding;

          piece.paletteX = x;
          piece.paletteY = y;

          drawPiece(ctx, piece, x, y, cols, rows, selectedPiece?.id === piece.id);
        });
      };

      useEffect(() => {
        if (image && difficulty) {
          drawBoard();
          drawPalette();
        }
      }, [pieces, image, selectedPiece, difficulty, gridDimensions]);

      const handleBoardClick = (e) => {
        if (completed || !difficulty) return;
        e.preventDefault();
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const { cols, rows } = gridDimensions;
        
        let clientX, clientY;
        if (e.type === 'touchend') {
          const touch = e.changedTouches[0];
          clientX = touch.clientX; clientY = touch.clientY;
        } else {
          clientX = e.clientX; clientY = e.clientY;
        }

        const actualX = ((clientX - rect.left) / rect.width) * canvas.width;
        const actualY = ((clientY - rect.top) / rect.height) * canvas.height;
        const col = Math.floor(actualX / PIECE_SIZE);
        const row = Math.floor(actualY / PIECE_SIZE);
        
        if (col < 0 || col >= cols || row < 0 || row >= rows) return;

        const clickedPiece = pieces.find(p =>
          !p.inPalette && !p.isEdge && p.currentRow === row && p.currentCol === col
        );

        if (clickedPiece) {
          setSelectedPiece(clickedPiece);
        } else if (selectedPiece) {
          const updated = pieces.map(p => {
            if (p.id === selectedPiece.id) {
              return { ...p, currentRow: row, currentCol: col, inPalette: false };
            }
            return p;
          });
          setPieces(updated);
          setSelectedPiece(null);
          if (checkCompletion(updated)) {
            setCompleted(true);
            setShowCelebration(true);
            createConfetti();
          }
        }
      };

      const handlePaletteClick = (e) => {
        e.preventDefault();
        const canvas = paletteRef.current;
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.type === 'touchend') {
          const touch = e.changedTouches[0];
          clientX = touch.clientX; clientY = touch.clientY;
        } else {
          clientX = e.clientX; clientY = e.clientY;
        }

        const actualX = ((clientX - rect.left) / rect.width) * canvas.width;
        const actualY = ((clientY - rect.top) / rect.height) * canvas.height;

        const clickedPiece = pieces.find(p =>
          p.inPalette && p.paletteX !== null &&
          actualX >= p.paletteX && actualX <= p.paletteX + PIECE_SIZE &&
          actualY >= p.paletteY && actualY <= p.paletteY + PIECE_SIZE
        );

        if (clickedPiece) setSelectedPiece(clickedPiece);
      };

      const returnToPalette = () => {
        if (!selectedPiece || selectedPiece.inPalette) return;
        setPieces(pieces.map(p => {
          if (p.id === selectedPiece.id) {
            return { ...p, currentRow: null, currentCol: null, inPalette: true };
          }
          return p;
        }));
        setSelectedPiece(null);
      };

      const resetGame = () => {
        if (image && difficulty) {
          const { cols, rows } = gridDimensions;
          initializePuzzle(image, cols, rows);
        }
      };

      const startNewGame = () => {
        setGameStarted(false);
        setDifficulty(null);
        setImage(null);
        setPieces([]);
        setCompleted(false);
        setShowCelebration(false);
        setSelectedPiece(null);
        setShowInstructions(true);
      };

      const loadNewPhoto = () => {
        // File input'u hemen aç (overlay üzerinden de çalışır)
        if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      const handleFileSelect = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            setImage(img);
            setGameStarted(true);
            setDifficulty(null);
            setPieces([]);
            setCompleted(false);
            setShowCelebration(false);
            setSelectedPiece(null);
            setShowInstructions(true);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };

      const loadDefaultPhoto = () => {
        const img = new Image();
        img.onload = () => {
          setImage(img);
          setGameStarted(true);
        };
        img.onerror = () => {
          alert("ph.JPEG bulunamadı! Lütfen dosyayı seç.");
          fileInputRef.current?.click();
        };
        img.src = "ph.JPEG";
      };

      if (!gameStarted || !image) {
        return (
          <div className="flex items-center justify-center min-h-screen p-4">
            <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelect} className="hidden" />
            <div className="bg-white/95 backdrop-blur rounded-3xl shadow-2xl p-8 md:p-12 max-w-2xl w-full text-center animate-fadeIn">
              <Heart className="w-20 h-20 md:w-24 md:h-24 mx-auto mb-4 text-red-500" />
              <h1 className="text-3xl md:text-5xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-purple-600">
                Hoşgeldin Aşkımm! 💕
              </h1>
              <div className="space-y-4 mb-8">
                <p className="text-xl md:text-2xl text-gray-700 font-medium">
                  Bugünkü görevin <span className="text-red-500 font-bold">bizi tamamlamak</span>
                </p>
                <p className="text-lg md:text-xl text-gray-600">Hadi dene bitanem! 🧩✨</p>
              </div>
              <button
                onClick={loadDefaultPhoto}
                className="group relative bg-gradient-to-r from-pink-500 via-red-500 to-purple-500 text-white px-10 py-5 md:px-12 md:py-6 rounded-2xl font-bold text-xl md:text-2xl hover:scale-110 transform transition-all duration-300 shadow-2xl overflow-hidden w-full"
              >
                <span className="relative z-10 flex items-center justify-center gap-3">
                  <Heart className="w-6 h-6" />
                  Başla
                  <Heart className="w-6 h-6" />
                </span>
              </button>
              <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelect} className="hidden" />
            </div>
          </div>
        );
      }

      if (!difficulty) {
        return (
          <div className="flex items-center justify-center min-h-screen p-4">
            <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-2xl w-full">
              <h1 className="text-2xl md:text-4xl font-bold mb-6 text-center text-gray-800">Zorluk Seviyesi Seç 🎮</h1>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {Object.entries(difficulties).map(([key, diff]) => (
                  <button
                    key={key}
                    onClick={() => {
                      setDifficulty(key);
                      setTimeout(() => {
                        initializePuzzle(image, diff.cols, diff.rows);
                      }, 0);
                    }}
                    className="bg-gradient-to-br from-pink-400 to-purple-500 hover:from-pink-500 hover:to-purple-600 text-white p-6 rounded-xl transform hover:scale-105 transition-all shadow-lg"
                  >
                    <div className="text-4xl mb-3">{diff.emoji}</div>
                    <div className="text-xl font-bold mb-2">{diff.name}</div>
                    <div className="text-sm opacity-90">{diff.pieces} Parça</div>
                    <div className="text-xs opacity-75 mt-1">{diff.cols}x{diff.rows}</div>
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen p-2 md:p-8">
          <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelect} className="hidden" />
          <div className="max-w-6xl mx-auto">
            <div className="bg-white rounded-xl md:rounded-2xl shadow-2xl p-3 md:p-6 mb-3 md:mb-6">
              <div className="flex items-center justify-between mb-3">
                <h1 className="text-lg md:text-3xl font-bold text-gray-800 flex items-center gap-2">
                  <Heart className="w-5 h-5 md:w-6 md:h-6 text-red-500" />
                  Yapboz - {difficulties[difficulty].name}
                </h1>
                <div className="flex gap-2">
                  {selectedPiece && !selectedPiece.inPalette && (
                    <button onClick={returnToPalette} className="flex items-center gap-1 bg-red-500 text-white px-2 md:px-3 py-2 rounded-lg hover:bg-red-600 transition text-xs md:text-sm">
                      <Trash2 className="w-4 h-4" />
                      <span className="hidden md:inline">Geri Al</span>
                    </button>
                  )}
                  <button onClick={resetGame} className="flex items-center gap-1 md:gap-2 bg-gray-600 text-white px-2 md:px-4 py-2 rounded-lg hover:bg-gray-700 transition text-xs md:text-base">
                    <RotateCcw className="w-5 h-5" />
                    <span className="hidden md:inline">Yeniden</span>
                  </button>
                  <button onClick={startNewGame} className="flex items-center gap-1 md:gap-2 bg-purple-600 text-white px-2 md:px-4 py-2 rounded-lg hover:bg-purple-700 transition text-xs md:text-base">
                    <Heart className="w-5 h-5" />
                    <span className="hidden md:inline">Başa Dön</span>
                  </button>
                </div>
              </div>

              {showInstructions && (
                <div className="bg-pink-50 border-2 border-pink-200 rounded-lg p-2 md:p-3 mb-3 text-xs md:text-sm">
                  <div className="flex items-start gap-2">
                    <Info className="w-5 h-5 text-pink-600" />
                    <div>
                      <p className="font-semibold text-pink-900 mb-1">Nasıl Oynanır:</p>
                      <p className="text-pink-800">1️⃣ Parçaya dokun (seçilir - mor kenarlık)</p>
                      <p className="text-pink-800">2️⃣ Tahtadaki boş kareye dokun (oraya gider)</p>
                      <p className="text-pink-800">3️⃣ Tahtadaki parçaya tekrar dokunup başka yere taşıyabilirsin</p>
                        <p className="text-pink-800">4️⃣Gri buton parçaları sıfırlar mor buton en başa götürür Hadi Bakalım.</p>
                      <button onClick={() => setShowInstructions(false)} className="text-pink-600 font-semibold mt-2 underline">Anladım ❤️</button>
                    </div>
                  </div>
                </div>
              )}

              <div className="flex items-center justify-between">
                <p className="text-gray-600 text-xs md:text-base">
                  Kalan: <span className="font-bold text-purple-600">{pieces.filter(p => p.inPalette).length}</span> / {pieces.filter(p => !p.isEdge).length}
                </p>
                {selectedPiece && <p className="text-purple-600 font-semibold text-xs md:text-sm animate-pulse">✨ Parça seçildi! Tahtaya dokun</p>}
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-3 md:gap-6">
              <div className="lg:col-span-2 bg-white rounded-xl md:rounded-2xl shadow-2xl p-3 md:p-6">
                <h2 className="text-base md:text-xl font-bold mb-3 md:mb-4 text-gray-800">Yapboz Tahtası</h2>
                <div className="flex justify-center overflow-auto">
                  <div className="relative inline-block">
                    <canvas
                      ref={canvasRef}
                      className="border-4 border-purple-300 rounded-lg cursor-pointer"
                      style={{ touchAction: 'manipulation', maxWidth: '100%', height: 'auto' }}
                      onClick={handleBoardClick}
                      onTouchEnd={handleBoardClick}
                    />
                    {showCelebration && (
                      <div className="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50 rounded-lg">
                        <div className="bg-gradient-to-br from-pink-100 to-purple-100 rounded-2xl p-4 md:p-8 text-center mx-2 border-4 border-pink-300 shadow-2xl">
                          <Trophy className="w-12 h-12 md:w-20 md:h-20 mx-auto mb-2 md:mb-4 text-yellow-500" />
                          <h2 className="text-xl md:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-purple-600 mb-1 md:mb-2">
                            Tebrikler Aşkımm! 🎉
                          </h2>
                          <p className="text-gray-700 text-sm md:text-lg mb-4 font-semibold">
                            Bizi bir araya getirdin! 💕✨
                          </p>
                          <div className="flex flex-col gap-3">
                            <button
                              onClick={loadNewPhoto}
                              className="bg-gradient-to-r from-pink-500 via-red-500 to-purple-500 text-white px-6 py-3 rounded-xl font-bold hover:scale-105 transform transition shadow-lg flex items-center gap-2 mx-auto"
                            >
                              <Upload className="w-5 h-5" />
                              Fotoğrafımızı Yükle
                            </button>
                            <button
                              onClick={startNewGame}
                              className="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-3 rounded-xl font-bold hover:scale-105 transform transition shadow-lg flex items-center gap-2 mx-auto"
                            >
                              <RotateCcw className="w-5 h-5" />
                              Baştan Başla
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-xl md:rounded-2xl shadow-2xl p-3 md:p-6">
                <h2 className="text-base md:text-xl font-bold mb-3 md:mb-4 text-gray-800">Parçalar</h2>
                <div className="overflow-auto" style={{ maxHeight: '70vh' }}>
                  <canvas
                    ref={paletteRef}
                    width={4 * (PIECE_SIZE + 10) + 10}
                    height={Math.max(200, Math.ceil(pieces.filter(p => p.inPalette).length / 4) * (PIECE_SIZE + 10) + 10)}
                    className="cursor-pointer"
                    style={{ touchAction: 'manipulation' }}
                    onClick={handlePaletteClick}
                    onTouchEnd={handlePaletteClick}
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PhotoPuzzle />);
  </script>
</body>
</html><!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fotoğraf Yapbozu 💕</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/lucide.min.js"></script>

  <style>
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .animate-fadeIn { animation: fadeIn 0.8s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: translateY(0);} }
    
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      animation: confetti-fall 3s linear forwards;
      pointer-events: none;
    }
    
    @keyframes confetti-fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-400 via-red-400 to-purple-500 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    function LucideIcon({ name, size = 24, className = "" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!window.lucide || !lucide.icons) return;
        const ic = lucide.icons[name];
        if (!ic || !ic.toSvg) return;
        ref.current.innerHTML = ic.toSvg({ width: size, height: size });
      }, [name, size]);
      return <span ref={ref} className={className}></span>;
    }

    const Heart = (p) => <LucideIcon name="heart" {...p} />;
    const Trophy = (p) => <LucideIcon name="trophy" {...p} />;
    const RotateCcw = (p) => <LucideIcon name="rotate-ccw" {...p} />;
    const Info = (p) => <LucideIcon name="info" {...p} />;
    const Trash2 = (p) => <LucideIcon name="trash-2" {...p} />;
    const Upload = (p) => <LucideIcon name="upload" {...p} />;

    function PhotoPuzzle() {
      const [gameStarted, setGameStarted] = useState(false);
      const [difficulty, setDifficulty] = useState(null);
      const [image, setImage] = useState(null);
      const [pieces, setPieces] = useState([]);
      const [selectedPiece, setSelectedPiece] = useState(null);
      const [completed, setCompleted] = useState(false);
      const [showCelebration, setShowCelebration] = useState(false);
      const [showInstructions, setShowInstructions] = useState(true);
      const canvasRef = useRef(null);
      const paletteRef = useRef(null);
      const fileInputRef = useRef(null);

      const difficulties = {
        easy: { cols: 5, rows: 5, name: 'Kolay', pieces: 25, emoji: '😊' },
        medium: { cols: 7, rows: 7, name: 'Orta', pieces: 49, emoji: '🤔' },
        hard: { cols: 9, rows: 8, name: 'Zor', pieces: 72, emoji: '😤' }
      };

      const PIECE_SIZE = 70;
      const KNOB_RADIUS = 12;

      const gridDimensions = useMemo(() => {
        if (!difficulty) return { cols: 5, rows: 5 };
        return { 
          cols: difficulties[difficulty].cols, 
          rows: difficulties[difficulty].rows 
        };
      }, [difficulty]);

      const createConfetti = () => {
        const colors = ['#ff0000', '#ff69b4', '#ff1493', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981'];
        const confettiCount = 100;
        
        for (let i = 0; i < confettiCount; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.top = '-20px';
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDelay = Math.random() * 0.5 + 's';
          confetti.style.animationDuration = (Math.random() * 1 + 2) + 's';
          document.body.appendChild(confetti);
          
          setTimeout(() => confetti.remove(), 5000);
        }
      };

      const initializePuzzle = (img, cols, rows) => {
        const knobs = {};
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const id = `${row}-${col}`;
            knobs[id] = {
              top: row === 0 ? 0 : (knobs[`${row-1}-${col}`]?.bottom ? -knobs[`${row-1}-${col}`].bottom : (Math.random() > 0.5 ? 1 : -1)),
              right: col === cols - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
              bottom: row === rows - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
              left: col === 0 ? 0 : (knobs[`${row}-${col-1}`]?.right ? -knobs[`${row}-${col-1}`].right : (Math.random() > 0.5 ? 1 : -1))
            };
          }
        }

        const newPieces = [];
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const isEdge = row === 0 || row === rows - 1 || col === 0 || col === cols - 1;
            const id = `${row}-${col}`;
            newPieces.push({
              id,
              correctRow: row,
              correctCol: col,
              currentRow: isEdge ? row : null,
              currentCol: isEdge ? col : null,
              inPalette: !isEdge,
              isEdge,
              knobs: knobs[id],
              paletteX: null,
              paletteY: null
            });
          }
        }

        setPieces(newPieces.sort((a, b) => {
          if (a.isEdge && !b.isEdge) return -1;
          if (!a.isEdge && b.isEdge) return 1;
          return Math.random() - 0.5;
        }));
        setCompleted(false);
        setShowCelebration(false);
        setSelectedPiece(null);
      };

      const checkCompletion = (currentPieces) => {
        return currentPieces.every(piece =>
          !piece.inPalette &&
          piece.currentRow === piece.correctRow &&
          piece.currentCol === piece.correctCol
        );
      };

      const createPiecePath = (ctx, x, y, size, knobs) => {
        ctx.beginPath();
        ctx.moveTo(x, y);
        if (knobs.top) {
          ctx.lineTo(x + size * 0.3, y);
          ctx.bezierCurveTo(
            x + size * 0.35, y + (knobs.top > 0 ? -KNOB_RADIUS : KNOB_RADIUS),
            x + size * 0.65, y + (knobs.top > 0 ? -KNOB_RADIUS : KNOB_RADIUS),
            x + size * 0.7, y
          );
        }
        ctx.lineTo(x + size, y);
        if (knobs.right) {
          ctx.lineTo(x + size, y + size * 0.3);
          ctx.bezierCurveTo(
            x + size + (knobs.right > 0 ? KNOB_RADIUS : -KNOB_RADIUS), y + size * 0.35,
            x + size + (knobs.right > 0 ? KNOB_RADIUS : -KNOB_RADIUS), y + size * 0.65,
            x + size, y + size * 0.7
          );
        }
        ctx.lineTo(x + size, y + size);
        if (knobs.bottom) {
          ctx.lineTo(x + size * 0.7, y + size);
          ctx.bezierCurveTo(
            x + size * 0.65, y + size + (knobs.bottom > 0 ? KNOB_RADIUS : -KNOB_RADIUS),
            x + size * 0.35, y + size + (knobs.bottom > 0 ? KNOB_RADIUS : -KNOB_RADIUS),
            x + size * 0.3, y + size
          );
        }
        ctx.lineTo(x, y + size);
        if (knobs.left) {
          ctx.lineTo(x, y + size * 0.7);
          ctx.bezierCurveTo(
            x + (knobs.left > 0 ? -KNOB_RADIUS : KNOB_RADIUS), y + size * 0.65,
            x + (knobs.left > 0 ? -KNOB_RADIUS : KNOB_RADIUS), y + size * 0.35,
            x, y + size * 0.3
          );
        }
        ctx.lineTo(x, y);
        ctx.closePath();
      };

      const drawPiece = (ctx, piece, x, y, cols, rows, isSelected = false) => {
        if (!image) return;
        const srcX = (piece.correctCol * image.width) / cols;
        const srcY = (piece.correctRow * image.height) / rows;
        const srcW = image.width / cols;
        const srcH = image.height / rows;

        ctx.save();
        createPiecePath(ctx, x, y, PIECE_SIZE, piece.knobs);
        ctx.clip();
        ctx.drawImage(image, srcX, srcY, srcW, srcH, x, y, PIECE_SIZE, PIECE_SIZE);
        ctx.restore();

        ctx.save();
        createPiecePath(ctx, x, y, PIECE_SIZE, piece.knobs);
        ctx.strokeStyle = isSelected ? '#8b5cf6' : 'rgba(0,0,0,0.4)';
        ctx.lineWidth = isSelected ? 4 : 2;
        ctx.stroke();
        if (isSelected) {
          ctx.shadowColor = 'rgba(139,92,246,0.5)';
          ctx.shadowBlur = 10;
          ctx.stroke();
        }
        ctx.restore();
      };

      const drawBoard = () => {
        if (!canvasRef.current || !image || !difficulty) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const { cols, rows } = gridDimensions;
        
        canvas.width = cols * PIECE_SIZE;
        canvas.height = rows * PIECE_SIZE;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f3f4f6';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#e5e7eb';
        ctx.lineWidth = 1;
        for (let i = 0; i <= cols; i++) {
          ctx.beginPath();
          ctx.moveTo(i * PIECE_SIZE, 0);
          ctx.lineTo(i * PIECE_SIZE, rows * PIECE_SIZE);
          ctx.stroke();
        }
        for (let i = 0; i <= rows; i++) {
          ctx.beginPath();
          ctx.moveTo(0, i * PIECE_SIZE);
          ctx.lineTo(cols * PIECE_SIZE, i * PIECE_SIZE);
          ctx.stroke();
        }

        pieces.forEach(piece => {
          if (!piece.inPalette && piece.currentRow !== null) {
            const x = piece.currentCol * PIECE_SIZE;
            const y = piece.currentRow * PIECE_SIZE;
            drawPiece(ctx, piece, x, y, cols, rows, selectedPiece?.id === piece.id);
          }
        });
      };

      const drawPalette = () => {
        if (!paletteRef.current || !image || !difficulty) return;
        const canvas = paletteRef.current;
        const ctx = canvas.getContext('2d');
        const { cols, rows } = gridDimensions;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const palettePieces = pieces.filter(p => p.inPalette);
        const palCols = 4;
        const padding = 10;

        palettePieces.forEach((piece, idx) => {
          const col = idx % palCols;
          const row = Math.floor(idx / palCols);
          const x = col * (PIECE_SIZE + padding) + padding;
          const y = row * (PIECE_SIZE + padding) + padding;

          piece.paletteX = x;
          piece.paletteY = y;

          drawPiece(ctx, piece, x, y, cols, rows, selectedPiece?.id === piece.id);
        });
      };

      useEffect(() => {
        if (image && difficulty) {
          drawBoard();
          drawPalette();
        }
      }, [pieces, image, selectedPiece, difficulty, gridDimensions]);

      const handleBoardClick = (e) => {
        if (completed || !difficulty) return;
        e.preventDefault();
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const { cols, rows } = gridDimensions;
        
        let clientX, clientY;
        if (e.type === 'touchend') {
          const touch = e.changedTouches[0];
          clientX = touch.clientX; clientY = touch.clientY;
        } else {
          clientX = e.clientX; clientY = e.clientY;
        }

        const actualX = ((clientX - rect.left) / rect.width) * canvas.width;
        const actualY = ((clientY - rect.top) / rect.height) * canvas.height;
        const col = Math.floor(actualX / PIECE_SIZE);
        const row = Math.floor(actualY / PIECE_SIZE);
        
        if (col < 0 || col >= cols || row < 0 || row >= rows) return;

        const clickedPiece = pieces.find(p =>
          !p.inPalette && !p.isEdge && p.currentRow === row && p.currentCol === col
        );

        if (clickedPiece) {
          setSelectedPiece(clickedPiece);
        } else if (selectedPiece) {
          const updated = pieces.map(p => {
            if (p.id === selectedPiece.id) {
              return { ...p, currentRow: row, currentCol: col, inPalette: false };
            }
            return p;
          });
          setPieces(updated);
          setSelectedPiece(null);
          if (checkCompletion(updated)) {
            setCompleted(true);
            setShowCelebration(true);
            createConfetti();
          }
        }
      };

      const handlePaletteClick = (e) => {
        e.preventDefault();
        const canvas = paletteRef.current;
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.type === 'touchend') {
          const touch = e.changedTouches[0];
          clientX = touch.clientX; clientY = touch.clientY;
        } else {
          clientX = e.clientX; clientY = e.clientY;
        }

        const actualX = ((clientX - rect.left) / rect.width) * canvas.width;
        const actualY = ((clientY - rect.top) / rect.height) * canvas.height;

        const clickedPiece = pieces.find(p =>
          p.inPalette && p.paletteX !== null &&
          actualX >= p.paletteX && actualX <= p.paletteX + PIECE_SIZE &&
          actualY >= p.paletteY && actualY <= p.paletteY + PIECE_SIZE
        );

        if (clickedPiece) setSelectedPiece(clickedPiece);
      };

      const returnToPalette = () => {
        if (!selectedPiece || selectedPiece.inPalette) return;
        setPieces(pieces.map(p => {
          if (p.id === selectedPiece.id) {
            return { ...p, currentRow: null, currentCol: null, inPalette: true };
          }
          return p;
        }));
        setSelectedPiece(null);
      };

      const resetGame = () => {
        if (image && difficulty) {
          const { cols, rows } = gridDimensions;
          initializePuzzle(image, cols, rows);
        }
      };

      const startNewGame = () => {
        setGameStarted(false);
        setDifficulty(null);
        setImage(null);
        setPieces([]);
        setCompleted(false);
        setShowCelebration(false);
        setSelectedPiece(null);
        setShowInstructions(true);
      };

      const loadNewPhoto = () => {
        // File input'u hemen aç (overlay üzerinden de çalışır)
        if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      const handleFileSelect = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            setImage(img);
            setGameStarted(true);
            setDifficulty(null);
            setPieces([]);
            setCompleted(false);
            setShowCelebration(false);
            setSelectedPiece(null);
            setShowInstructions(true);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };

      const loadDefaultPhoto = () => {
        const img = new Image();
        img.onload = () => {
          setImage(img);
          setGameStarted(true);
        };
        img.onerror = () => {
          alert("ph.JPEG bulunamadı! Lütfen dosyayı seç.");
          fileInputRef.current?.click();
        };
        img.src = "ph.JPEG";
      };

      if (!gameStarted || !image) {
        return (
          <div className="flex items-center justify-center min-h-screen p-4">
            <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelect} className="hidden" />
            <div className="bg-white/95 backdrop-blur rounded-3xl shadow-2xl p-8 md:p-12 max-w-2xl w-full text-center animate-fadeIn">
              <Heart className="w-20 h-20 md:w-24 md:h-24 mx-auto mb-4 text-red-500" />
              <h1 className="text-3xl md:text-5xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-purple-600">
                Hoşgeldin Aşkımm! 💕
              </h1>
              <div className="space-y-4 mb-8">
                <p className="text-xl md:text-2xl text-gray-700 font-medium">
                  Bugünkü görevin <span className="text-red-500 font-bold">bizi tamamlamak</span>
                </p>
                <p className="text-lg md:text-xl text-gray-600">Hadi dene bitanem! 🧩✨</p>
              </div>
              <button
                onClick={loadDefaultPhoto}
                className="group relative bg-gradient-to-r from-pink-500 via-red-500 to-purple-500 text-white px-10 py-5 md:px-12 md:py-6 rounded-2xl font-bold text-xl md:text-2xl hover:scale-110 transform transition-all duration-300 shadow-2xl overflow-hidden w-full"
              >
                <span className="relative z-10 flex items-center justify-center gap-3">
                  <Heart className="w-6 h-6" />
                  Başla
                  <Heart className="w-6 h-6" />
                </span>
              </button>
              <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelect} className="hidden" />
            </div>
          </div>
        );
      }

      if (!difficulty) {
        return (
          <div className="flex items-center justify-center min-h-screen p-4">
            <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-2xl w-full">
              <h1 className="text-2xl md:text-4xl font-bold mb-6 text-center text-gray-800">Zorluk Seviyesi Seç 🎮</h1>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {Object.entries(difficulties).map(([key, diff]) => (
                  <button
                    key={key}
                    onClick={() => {
                      setDifficulty(key);
                      setTimeout(() => {
                        initializePuzzle(image, diff.cols, diff.rows);
                      }, 0);
                    }}
                    className="bg-gradient-to-br from-pink-400 to-purple-500 hover:from-pink-500 hover:to-purple-600 text-white p-6 rounded-xl transform hover:scale-105 transition-all shadow-lg"
                  >
                    <div className="text-4xl mb-3">{diff.emoji}</div>
                    <div className="text-xl font-bold mb-2">{diff.name}</div>
                    <div className="text-sm opacity-90">{diff.pieces} Parça</div>
                    <div className="text-xs opacity-75 mt-1">{diff.cols}x{diff.rows}</div>
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen p-2 md:p-8">
          <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelect} className="hidden" />
          <div className="max-w-6xl mx-auto">
            <div className="bg-white rounded-xl md:rounded-2xl shadow-2xl p-3 md:p-6 mb-3 md:mb-6">
              <div className="flex items-center justify-between mb-3">
                <h1 className="text-lg md:text-3xl font-bold text-gray-800 flex items-center gap-2">
                  <Heart className="w-5 h-5 md:w-6 md:h-6 text-red-500" />
                  Yapboz - {difficulties[difficulty].name}
                </h1>
                <div className="flex gap-2">
                  {selectedPiece && !selectedPiece.inPalette && (
                    <button onClick={returnToPalette} className="flex items-center gap-1 bg-red-500 text-white px-2 md:px-3 py-2 rounded-lg hover:bg-red-600 transition text-xs md:text-sm">
                      <Trash2 className="w-4 h-4" />
                      <span className="hidden md:inline">Geri Al</span>
                    </button>
                  )}
                  <button onClick={resetGame} className="flex items-center gap-1 md:gap-2 bg-gray-600 text-white px-2 md:px-4 py-2 rounded-lg hover:bg-gray-700 transition text-xs md:text-base">
                    <RotateCcw className="w-5 h-5" />
                    <span className="hidden md:inline">Yeniden</span>
                  </button>
                  <button onClick={startNewGame} className="flex items-center gap-1 md:gap-2 bg-purple-600 text-white px-2 md:px-4 py-2 rounded-lg hover:bg-purple-700 transition text-xs md:text-base">
                    <Heart className="w-5 h-5" />
                    <span className="hidden md:inline">Başa Dön</span>
                  </button>
                </div>
              </div>

              {showInstructions && (
                <div className="bg-pink-50 border-2 border-pink-200 rounded-lg p-2 md:p-3 mb-3 text-xs md:text-sm">
                  <div className="flex items-start gap-2">
                    <Info className="w-5 h-5 text-pink-600" />
                    <div>
                      <p className="font-semibold text-pink-900 mb-1">Nasıl Oynanır:</p>
                      <p className="text-pink-800">1️⃣ Parçaya dokun (seç - mor kenarlık)</p>
                      <p className="text-pink-800">2️⃣ Tahtadaki boş kareye dokun (oraya gider)</p>
                      <p className="text-pink-800">3️⃣ Tahtadaki parçaya tekrar dokunup başka yere taşıyabilirsin</p>
                       <p className="text-pink-800">3️4️⃣Gri buton parçaları sıfırlar mor ise en başa götürür Hadi bakalım.</p>
                      <button onClick={() => setShowInstructions(false)} className="text-pink-600 font-semibold mt-2 underline">Anladım ❤️</button>
                    </div>
                  </div>
                </div>
              )}

              <div className="flex items-center justify-between">
                <p className="text-gray-600 text-xs md:text-base">
                  Kalan: <span className="font-bold text-purple-600">{pieces.filter(p => p.inPalette).length}</span> / {pieces.filter(p => !p.isEdge).length}
                </p>
                {selectedPiece && <p className="text-purple-600 font-semibold text-xs md:text-sm animate-pulse">✨ Parça seçildi! Tahtaya dokun</p>}
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-3 md:gap-6">
              <div className="lg:col-span-2 bg-white rounded-xl md:rounded-2xl shadow-2xl p-3 md:p-6">
                <h2 className="text-base md:text-xl font-bold mb-3 md:mb-4 text-gray-800">Yapboz Tahtası</h2>
                <div className="flex justify-center overflow-auto">
                  <div className="relative inline-block">
                    <canvas
                      ref={canvasRef}
                      className="border-4 border-purple-300 rounded-lg cursor-pointer"
                      style={{ touchAction: 'manipulation', maxWidth: '100%', height: 'auto' }}
                      onClick={handleBoardClick}
                      onTouchEnd={handleBoardClick}
                    />
                    {showCelebration && (
                      <div className="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50 rounded-lg">
                        <div className="bg-gradient-to-br from-pink-100 to-purple-100 rounded-2xl p-4 md:p-8 text-center mx-2 border-4 border-pink-300 shadow-2xl">
                          <Trophy className="w-12 h-12 md:w-20 md:h-20 mx-auto mb-2 md:mb-4 text-yellow-500" />
                          <h2 className="text-xl md:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-purple-600 mb-1 md:mb-2">
                            Tebrikler Aşkımm! 🎉
                          </h2>
                          <p className="text-gray-700 text-sm md:text-lg mb-4 font-semibold">
                            Bizi bir araya getirdin! 💕✨
                          </p>
                          <div className="flex flex-col gap-3">
                            <button
                              onClick={loadNewPhoto}
                              className="bg-gradient-to-r from-pink-500 via-red-500 to-purple-500 text-white px-6 py-3 rounded-xl font-bold hover:scale-105 transform transition shadow-lg flex items-center gap-2 mx-auto"
                            >
                              <Upload className="w-5 h-5" />
                              Fotoğrafımızı Yükle
                            </button>
                            <button
                              onClick={startNewGame}
                              className="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-3 rounded-xl font-bold hover:scale-105 transform transition shadow-lg flex items-center gap-2 mx-auto"
                            >
                              <RotateCcw className="w-5 h-5" />
                              Baştan Başla
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-xl md:rounded-2xl shadow-2xl p-3 md:p-6">
                <h2 className="text-base md:text-xl font-bold mb-3 md:mb-4 text-gray-800">Parçalar</h2>
                <div className="overflow-auto" style={{ maxHeight: '70vh' }}>
                  <canvas
                    ref={paletteRef}
                    width={4 * (PIECE_SIZE + 10) + 10}
                    height={Math.max(200, Math.ceil(pieces.filter(p => p.inPalette).length / 4) * (PIECE_SIZE + 10) + 10)}
                    className="cursor-pointer"
                    style={{ touchAction: 'manipulation' }}
                    onClick={handlePaletteClick}
                    onTouchEnd={handlePaletteClick}
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PhotoPuzzle />);
  </script>
</body>
</html><!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fotoğraf Yapbozu 💕</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/lucide.min.js"></script>

  <style>
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; }
    .animate-fadeIn { animation: fadeIn 0.8s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: translateY(0);} }
    
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      animation: confetti-fall 3s linear forwards;
      pointer-events: none;
    }
    
    @keyframes confetti-fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-400 via-red-400 to-purple-500 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    function LucideIcon({ name, size = 24, className = "" }) {
      const ref = useRef(null);
      useEffect(() => {
        if (!window.lucide || !lucide.icons) return;
        const ic = lucide.icons[name];
        if (!ic || !ic.toSvg) return;
        ref.current.innerHTML = ic.toSvg({ width: size, height: size });
      }, [name, size]);
      return <span ref={ref} className={className}></span>;
    }

    const Heart = (p) => <LucideIcon name="heart" {...p} />;
    const Trophy = (p) => <LucideIcon name="trophy" {...p} />;
    const RotateCcw = (p) => <LucideIcon name="rotate-ccw" {...p} />;
    const Info = (p) => <LucideIcon name="info" {...p} />;
    const Trash2 = (p) => <LucideIcon name="trash-2" {...p} />;
    const Upload = (p) => <LucideIcon name="upload" {...p} />;

    function PhotoPuzzle() {
      const [gameStarted, setGameStarted] = useState(false);
      const [difficulty, setDifficulty] = useState(null);
      const [image, setImage] = useState(null);
      const [pieces, setPieces] = useState([]);
      const [selectedPiece, setSelectedPiece] = useState(null);
      const [completed, setCompleted] = useState(false);
      const [showCelebration, setShowCelebration] = useState(false);
      const [showInstructions, setShowInstructions] = useState(true);
      const canvasRef = useRef(null);
      const paletteRef = useRef(null);
      const fileInputRef = useRef(null);

      const difficulties = {
        easy: { cols: 5, rows: 5, name: 'Kolay', pieces: 25, emoji: '😊' },
        medium: { cols: 7, rows: 7, name: 'Orta', pieces: 49, emoji: '🤔' },
        hard: { cols: 9, rows: 8, name: 'Zor', pieces: 72, emoji: '😤' }
      };

      const PIECE_SIZE = 70;
      const KNOB_RADIUS = 12;

      const gridDimensions = useMemo(() => {
        if (!difficulty) return { cols: 5, rows: 5 };
        return { 
          cols: difficulties[difficulty].cols, 
          rows: difficulties[difficulty].rows 
        };
      }, [difficulty]);

      const createConfetti = () => {
        const colors = ['#ff0000', '#ff69b4', '#ff1493', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981'];
        const confettiCount = 100;
        
        for (let i = 0; i < confettiCount; i++) {
          const confetti = document.createElement('div');
          confetti.className = 'confetti';
          confetti.style.left = Math.random() * 100 + 'vw';
          confetti.style.top = '-20px';
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.animationDelay = Math.random() * 0.5 + 's';
          confetti.style.animationDuration = (Math.random() * 1 + 2) + 's';
          document.body.appendChild(confetti);
          
          setTimeout(() => confetti.remove(), 5000);
        }
      };

      const initializePuzzle = (img, cols, rows) => {
        const knobs = {};
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const id = `${row}-${col}`;
            knobs[id] = {
              top: row === 0 ? 0 : (knobs[`${row-1}-${col}`]?.bottom ? -knobs[`${row-1}-${col}`].bottom : (Math.random() > 0.5 ? 1 : -1)),
              right: col === cols - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
              bottom: row === rows - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
              left: col === 0 ? 0 : (knobs[`${row}-${col-1}`]?.right ? -knobs[`${row}-${col-1}`].right : (Math.random() > 0.5 ? 1 : -1))
            };
          }
        }

        const newPieces = [];
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            const isEdge = row === 0 || row === rows - 1 || col === 0 || col === cols - 1;
            const id = `${row}-${col}`;
            newPieces.push({
              id,
              correctRow: row,
              correctCol: col,
              currentRow: isEdge ? row : null,
              currentCol: isEdge ? col : null,
              inPalette: !isEdge,
              isEdge,
              knobs: knobs[id],
              paletteX: null,
              paletteY: null
            });
          }
        }

        setPieces(newPieces.sort((a, b) => {
          if (a.isEdge && !b.isEdge) return -1;
          if (!a.isEdge && b.isEdge) return 1;
          return Math.random() - 0.5;
        }));
        setCompleted(false);
        setShowCelebration(false);
        setSelectedPiece(null);
      };

      const checkCompletion = (currentPieces) => {
        return currentPieces.every(piece =>
          !piece.inPalette &&
          piece.currentRow === piece.correctRow &&
          piece.currentCol === piece.correctCol
        );
      };

      const createPiecePath = (ctx, x, y, size, knobs) => {
        ctx.beginPath();
        ctx.moveTo(x, y);
        if (knobs.top) {
          ctx.lineTo(x + size * 0.3, y);
          ctx.bezierCurveTo(
            x + size * 0.35, y + (knobs.top > 0 ? -KNOB_RADIUS : KNOB_RADIUS),
            x + size * 0.65, y + (knobs.top > 0 ? -KNOB_RADIUS : KNOB_RADIUS),
            x + size * 0.7, y
          );
        }
        ctx.lineTo(x + size, y);
        if (knobs.right) {
          ctx.lineTo(x + size, y + size * 0.3);
          ctx.bezierCurveTo(
            x + size + (knobs.right > 0 ? KNOB_RADIUS : -KNOB_RADIUS), y + size * 0.35,
            x + size + (knobs.right > 0 ? KNOB_RADIUS : -KNOB_RADIUS), y + size * 0.65,
            x + size, y + size * 0.7
          );
        }
        ctx.lineTo(x + size, y + size);
        if (knobs.bottom) {
          ctx.lineTo(x + size * 0.7, y + size);
          ctx.bezierCurveTo(
            x + size * 0.65, y + size + (knobs.bottom > 0 ? KNOB_RADIUS : -KNOB_RADIUS),
            x + size * 0.35, y + size + (knobs.bottom > 0 ? KNOB_RADIUS : -KNOB_RADIUS),
            x + size * 0.3, y + size
          );
        }
        ctx.lineTo(x, y + size);
        if (knobs.left) {
          ctx.lineTo(x, y + size * 0.7);
          ctx.bezierCurveTo(
            x + (knobs.left > 0 ? -KNOB_RADIUS : KNOB_RADIUS), y + size * 0.65,
            x + (knobs.left > 0 ? -KNOB_RADIUS : KNOB_RADIUS), y + size * 0.35,
            x, y + size * 0.3
          );
        }
        ctx.lineTo(x, y);
        ctx.closePath();
      };

      const drawPiece = (ctx, piece, x, y, cols, rows, isSelected = false) => {
        if (!image) return;
        const srcX = (piece.correctCol * image.width) / cols;
        const srcY = (piece.correctRow * image.height) / rows;
        const srcW = image.width / cols;
        const srcH = image.height / rows;

        ctx.save();
        createPiecePath(ctx, x, y, PIECE_SIZE, piece.knobs);
        ctx.clip();
        ctx.drawImage(image, srcX, srcY, srcW, srcH, x, y, PIECE_SIZE, PIECE_SIZE);
        ctx.restore();

        ctx.save();
        createPiecePath(ctx, x, y, PIECE_SIZE, piece.knobs);
        ctx.strokeStyle = isSelected ? '#8b5cf6' : 'rgba(0,0,0,0.4)';
        ctx.lineWidth = isSelected ? 4 : 2;
        ctx.stroke();
        if (isSelected) {
          ctx.shadowColor = 'rgba(139,92,246,0.5)';
          ctx.shadowBlur = 10;
          ctx.stroke();
        }
        ctx.restore();
      };

      const drawBoard = () => {
        if (!canvasRef.current || !image || !difficulty) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const { cols, rows } = gridDimensions;
        
        canvas.width = cols * PIECE_SIZE;
        canvas.height = rows * PIECE_SIZE;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f3f4f6';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#e5e7eb';
        ctx.lineWidth = 1;
        for (let i = 0; i <= cols; i++) {
          ctx.beginPath();
          ctx.moveTo(i * PIECE_SIZE, 0);
          ctx.lineTo(i * PIECE_SIZE, rows * PIECE_SIZE);
          ctx.stroke();
        }
        for (let i = 0; i <= rows; i++) {
          ctx.beginPath();
          ctx.moveTo(0, i * PIECE_SIZE);
          ctx.lineTo(cols * PIECE_SIZE, i * PIECE_SIZE);
          ctx.stroke();
        }

        pieces.forEach(piece => {
          if (!piece.inPalette && piece.currentRow !== null) {
            const x = piece.currentCol * PIECE_SIZE;
            const y = piece.currentRow * PIECE_SIZE;
            drawPiece(ctx, piece, x, y, cols, rows, selectedPiece?.id === piece.id);
          }
        });
      };

      const drawPalette = () => {
        if (!paletteRef.current || !image || !difficulty) return;
        const canvas = paletteRef.current;
        const ctx = canvas.getContext('2d');
        const { cols, rows } = gridDimensions;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const palettePieces = pieces.filter(p => p.inPalette);
        const palCols = 4;
        const padding = 10;

        palettePieces.forEach((piece, idx) => {
          const col = idx % palCols;
          const row = Math.floor(idx / palCols);
          const x = col * (PIECE_SIZE + padding) + padding;
          const y = row * (PIECE_SIZE + padding) + padding;

          piece.paletteX = x;
          piece.paletteY = y;

          drawPiece(ctx, piece, x, y, cols, rows, selectedPiece?.id === piece.id);
        });
      };

      useEffect(() => {
        if (image && difficulty) {
          drawBoard();
          drawPalette();
        }
      }, [pieces, image, selectedPiece, difficulty, gridDimensions]);

      const handleBoardClick = (e) => {
        if (completed || !difficulty) return;
        e.preventDefault();
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const { cols, rows } = gridDimensions;
        
        let clientX, clientY;
        if (e.type === 'touchend') {
          const touch = e.changedTouches[0];
          clientX = touch.clientX; clientY = touch.clientY;
        } else {
          clientX = e.clientX; clientY = e.clientY;
        }

        const actualX = ((clientX - rect.left) / rect.width) * canvas.width;
        const actualY = ((clientY - rect.top) / rect.height) * canvas.height;
        const col = Math.floor(actualX / PIECE_SIZE);
        const row = Math.floor(actualY / PIECE_SIZE);
        
        if (col < 0 || col >= cols || row < 0 || row >= rows) return;

        const clickedPiece = pieces.find(p =>
          !p.inPalette && !p.isEdge && p.currentRow === row && p.currentCol === col
        );

        if (clickedPiece) {
          setSelectedPiece(clickedPiece);
        } else if (selectedPiece) {
          const updated = pieces.map(p => {
            if (p.id === selectedPiece.id) {
              return { ...p, currentRow: row, currentCol: col, inPalette: false };
            }
            return p;
          });
          setPieces(updated);
          setSelectedPiece(null);
          if (checkCompletion(updated)) {
            setCompleted(true);
            setShowCelebration(true);
            createConfetti();
          }
        }
      };

      const handlePaletteClick = (e) => {
        e.preventDefault();
        const canvas = paletteRef.current;
        const rect = canvas.getBoundingClientRect();
        let clientX, clientY;
        if (e.type === 'touchend') {
          const touch = e.changedTouches[0];
          clientX = touch.clientX; clientY = touch.clientY;
        } else {
          clientX = e.clientX; clientY = e.clientY;
        }

        const actualX = ((clientX - rect.left) / rect.width) * canvas.width;
        const actualY = ((clientY - rect.top) / rect.height) * canvas.height;

        const clickedPiece = pieces.find(p =>
          p.inPalette && p.paletteX !== null &&
          actualX >= p.paletteX && actualX <= p.paletteX + PIECE_SIZE &&
          actualY >= p.paletteY && actualY <= p.paletteY + PIECE_SIZE
        );

        if (clickedPiece) setSelectedPiece(clickedPiece);
      };

      const returnToPalette = () => {
        if (!selectedPiece || selectedPiece.inPalette) return;
        setPieces(pieces.map(p => {
          if (p.id === selectedPiece.id) {
            return { ...p, currentRow: null, currentCol: null, inPalette: true };
          }
          return p;
        }));
        setSelectedPiece(null);
      };

      const resetGame = () => {
        if (image && difficulty) {
          const { cols, rows } = gridDimensions;
          initializePuzzle(image, cols, rows);
        }
      };

      const startNewGame = () => {
        setGameStarted(false);
        setDifficulty(null);
        setImage(null);
        setPieces([]);
        setCompleted(false);
        setShowCelebration(false);
        setSelectedPiece(null);
        setShowInstructions(true);
      };

      const loadNewPhoto = () => {
        // File input'u hemen aç (overlay üzerinden de çalışır)
        if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      const handleFileSelect = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            setImage(img);
            setGameStarted(true);
            setDifficulty(null);
            setPieces([]);
            setCompleted(false);
            setShowCelebration(false);
            setSelectedPiece(null);
            setShowInstructions(true);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      };

      const loadDefaultPhoto = () => {
        const img = new Image();
        img.onload = () => {
          setImage(img);
          setGameStarted(true);
        };
        img.onerror = () => {
          alert("ph.JPEG bulunamadı! Lütfen dosyayı seç.");
          fileInputRef.current?.click();
        };
        img.src = "ph.JPEG";
      };

      if (!gameStarted || !image) {
        return (
          <div className="flex items-center justify-center min-h-screen p-4">
            <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelect} className="hidden" />
            <div className="bg-white/95 backdrop-blur rounded-3xl shadow-2xl p-8 md:p-12 max-w-2xl w-full text-center animate-fadeIn">
              <Heart className="w-20 h-20 md:w-24 md:h-24 mx-auto mb-4 text-red-500" />
              <h1 className="text-3xl md:text-5xl font-bold mb-6 text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-purple-600">
                Hoşgeldin Aşkımm! 💕
              </h1>
              <div className="space-y-4 mb-8">
                <p className="text-xl md:text-2xl text-gray-700 font-medium">
                  Bugünkü görevin <span className="text-red-500 font-bold">bizi tamamlamak</span>
                </p>
                <p className="text-lg md:text-xl text-gray-600">Hadi dene bitanem! 🧩✨</p>
              </div>
              <button
                onClick={loadDefaultPhoto}
                className="group relative bg-gradient-to-r from-pink-500 via-red-500 to-purple-500 text-white px-10 py-5 md:px-12 md:py-6 rounded-2xl font-bold text-xl md:text-2xl hover:scale-110 transform transition-all duration-300 shadow-2xl overflow-hidden w-full"
              >
                <span className="relative z-10 flex items-center justify-center gap-3">
                  <Heart className="w-6 h-6" />
                  Başla
                  <Heart className="w-6 h-6" />
                </span>
              </button>
              <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelect} className="hidden" />
            </div>
          </div>
        );
      }

      if (!difficulty) {
        return (
          <div className="flex items-center justify-center min-h-screen p-4">
            <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-2xl w-full">
              <h1 className="text-2xl md:text-4xl font-bold mb-6 text-center text-gray-800">Zorluk Seviyesi Seç 🎮</h1>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {Object.entries(difficulties).map(([key, diff]) => (
                  <button
                    key={key}
                    onClick={() => {
                      setDifficulty(key);
                      setTimeout(() => {
                        initializePuzzle(image, diff.cols, diff.rows);
                      }, 0);
                    }}
                    className="bg-gradient-to-br from-pink-400 to-purple-500 hover:from-pink-500 hover:to-purple-600 text-white p-6 rounded-xl transform hover:scale-105 transition-all shadow-lg"
                  >
                    <div className="text-4xl mb-3">{diff.emoji}</div>
                    <div className="text-xl font-bold mb-2">{diff.name}</div>
                    <div className="text-sm opacity-90">{diff.pieces} Parça</div>
                    <div className="text-xs opacity-75 mt-1">{diff.cols}x{diff.rows}</div>
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen p-2 md:p-8">
          <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileSelect} className="hidden" />
          <div className="max-w-6xl mx-auto">
            <div className="bg-white rounded-xl md:rounded-2xl shadow-2xl p-3 md:p-6 mb-3 md:mb-6">
              <div className="flex items-center justify-between mb-3">
                <h1 className="text-lg md:text-3xl font-bold text-gray-800 flex items-center gap-2">
                  <Heart className="w-5 h-5 md:w-6 md:h-6 text-red-500" />
                  Yapboz - {difficulties[difficulty].name}
                </h1>
                <div className="flex gap-2">
                  {selectedPiece && !selectedPiece.inPalette && (
                    <button onClick={returnToPalette} className="flex items-center gap-1 bg-red-500 text-white px-2 md:px-3 py-2 rounded-lg hover:bg-red-600 transition text-xs md:text-sm">
                      <Trash2 className="w-4 h-4" />
                      <span className="hidden md:inline">Geri Al</span>
                    </button>
                  )}
                  <button onClick={resetGame} className="flex items-center gap-1 md:gap-2 bg-gray-600 text-white px-2 md:px-4 py-2 rounded-lg hover:bg-gray-700 transition text-xs md:text-base">
                    <RotateCcw className="w-5 h-5" />
                    <span className="hidden md:inline">Yeniden</span>
                  </button>
                  <button onClick={startNewGame} className="flex items-center gap-1 md:gap-2 bg-purple-600 text-white px-2 md:px-4 py-2 rounded-lg hover:bg-purple-700 transition text-xs md:text-base">
                    <Heart className="w-5 h-5" />
                    <span className="hidden md:inline">Başa Dön</span>
                  </button>
                </div>
              </div>

              {showInstructions && (
                <div className="bg-pink-50 border-2 border-pink-200 rounded-lg p-2 md:p-3 mb-3 text-xs md:text-sm">
                  <div className="flex items-start gap-2">
                    <Info className="w-5 h-5 text-pink-600" />
                    <div>
                      <p className="font-semibold text-pink-900 mb-1">Nasıl Oynanır:</p>
                      <p className="text-pink-800">1️⃣ Parçaya dokun (seçilir - mor kenarlık)</p>
                      <p className="text-pink-800">2️⃣ Tahtadaki boş kareye dokun (oraya gider)</p>
                      <p className="text-pink-800">3️⃣ Tahtadaki parçaya tekrar dokunup başka yere taşıyabilirsin</p>
                      <button onClick={() => setShowInstructions(false)} className="text-pink-600 font-semibold mt-2 underline">Anladım ❤️</button>
                    </div>
                  </div>
                </div>
              )}

              <div className="flex items-center justify-between">
                <p className="text-gray-600 text-xs md:text-base">
                  Kalan: <span className="font-bold text-purple-600">{pieces.filter(p => p.inPalette).length}</span> / {pieces.filter(p => !p.isEdge).length}
                </p>
                {selectedPiece && <p className="text-purple-600 font-semibold text-xs md:text-sm animate-pulse">✨ Parça seçildi! Tahtaya dokun</p>}
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-3 md:gap-6">
              <div className="lg:col-span-2 bg-white rounded-xl md:rounded-2xl shadow-2xl p-3 md:p-6">
                <h2 className="text-base md:text-xl font-bold mb-3 md:mb-4 text-gray-800">Yapboz Tahtası</h2>
                <div className="flex justify-center overflow-auto">
                  <div className="relative inline-block">
                    <canvas
                      ref={canvasRef}
                      className="border-4 border-purple-300 rounded-lg cursor-pointer"
                      style={{ touchAction: 'manipulation', maxWidth: '100%', height: 'auto' }}
                      onClick={handleBoardClick}
                      onTouchEnd={handleBoardClick}
                    />
                    {showCelebration && (
                      <div className="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50 rounded-lg">
                        <div className="bg-gradient-to-br from-pink-100 to-purple-100 rounded-2xl p-4 md:p-8 text-center mx-2 border-4 border-pink-300 shadow-2xl">
                          <Trophy className="w-12 h-12 md:w-20 md:h-20 mx-auto mb-2 md:mb-4 text-yellow-500" />
                          <h2 className="text-xl md:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-600 to-purple-600 mb-1 md:mb-2">
                            Tebrikler Aşkımm! 🎉
                          </h2>
                          <p className="text-gray-700 text-sm md:text-lg mb-4 font-semibold">
                            Bizi bir araya getirdin! 💕✨
                          </p>
                          <div className="flex flex-col gap-3">
                            <button
                              onClick={loadNewPhoto}
                              className="bg-gradient-to-r from-pink-500 via-red-500 to-purple-500 text-white px-6 py-3 rounded-xl font-bold hover:scale-105 transform transition shadow-lg flex items-center gap-2 mx-auto"
                            >
                              <Upload className="w-5 h-5" />
                              Fotoğrafımızı Yükle
                            </button>
                            <button
                              onClick={startNewGame}
                              className="bg-gradient-to-r from-purple-500 to-pink-500 text-white px-6 py-3 rounded-xl font-bold hover:scale-105 transform transition shadow-lg flex items-center gap-2 mx-auto"
                            >
                              <RotateCcw className="w-5 h-5" />
                              Baştan Başla
                            </button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-xl md:rounded-2xl shadow-2xl p-3 md:p-6">
                <h2 className="text-base md:text-xl font-bold mb-3 md:mb-4 text-gray-800">Parçalar</h2>
                <div className="overflow-auto" style={{ maxHeight: '70vh' }}>
                  <canvas
                    ref={paletteRef}
                    width={4 * (PIECE_SIZE + 10) + 10}
                    height={Math.max(200, Math.ceil(pieces.filter(p => p.inPalette).length / 4) * (PIECE_SIZE + 10) + 10)}
                    className="cursor-pointer"
                    style={{ touchAction: 'manipulation' }}
                    onClick={handlePaletteClick}
                    onTouchEnd={handlePaletteClick}
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PhotoPuzzle />);
  </script>
</body>
</html><!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fotoğraf Yapbozu 💕</title>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
