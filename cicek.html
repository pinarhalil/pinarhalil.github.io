<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Çiçeğim - Pınar 💐</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1a1a2e, #0f3460);
      overflow: hidden;
      font-family: 'Georgia', serif;
      color: #fff;
      cursor: pointer;
    }

    .star {
      position: fixed;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .heart {
      position: fixed;
      width: 20px;
      height: 20px;
      pointer-events: none;
      animation: heartFloat 2s ease-out forwards;
      z-index: 1000;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 30px;
      background: rgba(255, 105, 180, 0.8);
      border-radius: 20px 20px 0 0;
    }

    .heart::before {
      left: -10px;
      transform: rotate(-45deg);
    }

    .heart::after {
      left: 10px;
      transform: rotate(45deg);
    }

    @keyframes heartFloat {
      to {
        transform: translateY(-150px) scale(0.5) rotate(30deg);
        opacity: 0;
      }
    }

    .scene {
      position: relative;
      width: 400px;
      height: 600px;
    }

    .title {
      position: absolute;
      top: -80px;
      width: 100%;
      text-align: center;
      animation: fadeInDown 1.5s ease-out;
    }

    .title h1 {
      font-size: 2rem;
      margin: 0 0 10px 0;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 182, 193, 0.8);
      letter-spacing: 2px;
      font-weight: 300;
    }

    .title p {
      font-size: 1.2rem;
      margin: 0;
      color: rgba(255, 255, 255, 0.8);
      font-style: italic;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stem {
      position: absolute;
      bottom: 140px;
      left: 50%;
      width: 6px;
      height: 0;
      background: linear-gradient(to top, #2d5016, #4a7c2c, #5a8c3c);
      transform: translateX(-50%);
      animation: stemGrow 2.5s ease-out forwards;
      box-shadow: -2px 0 6px rgba(0, 0, 0, 0.3);
      border-radius: 3px;
    }

    @keyframes stemGrow {
      from { height: 0; }
      to { height: 280px; }
    }

    .leaf {
      position: absolute;
      width: 20px;
      height: 85px;
      background: linear-gradient(180deg, #5a8c3c, #4a7c2c, #2d5016);
      border-radius: 100% 0 100% 0;
      transform-origin: bottom;
      opacity: 0;
      animation: leafAppear 1.5s ease forwards;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
    }

    .leaf::before {
      content: '';
      position: absolute;
      top: 10%;
      left: 5%;
      width: 2px;
      height: 80%;
      background: linear-gradient(to bottom, rgba(200, 255, 180, 0.6), transparent);
    }

    .leaf.small {
      height: 65px;
      width: 16px;
    }

    .leaf.tiny {
      height: 45px;
      width: 12px;
    }

    @keyframes leafAppear {
      from { opacity: 0; transform: scale(0.5) rotate(var(--r)); }
      to { opacity: 1; transform: scale(1) rotate(var(--r)); }
    }

    .cluster {
      position: absolute;
      opacity: 0;
      animation: clusterIn 1.8s ease forwards;
      z-index: 10;
    }

    @keyframes clusterIn {
      from { opacity: 0; transform: scale(0.4); }
      to { opacity: 1; transform: scale(1); }
    }

    .cluster-1 { left: 48%; top: 80px; animation-delay: 2.8s; }
    .cluster-2 { left: 32%; top: 110px; animation-delay: 3s; }
    .cluster-3 { left: 64%; top: 100px; animation-delay: 3.2s; }
    .cluster-4 { left: 40%; top: 140px; animation-delay: 3.4s; }
    .cluster-5 { left: 56%; top: 135px; animation-delay: 3.6s; }
    .cluster-6 { left: 48%; top: 165px; animation-delay: 3.8s; }
    .cluster-7 { left: 28%; top: 160px; animation-delay: 4s; }
    .cluster-8 { left: 68%; top: 155px; animation-delay: 4.2s; }
    .cluster-9 { left: 36%; top: 190px; animation-delay: 4.4s; }
    .cluster-10 { left: 60%; top: 185px; animation-delay: 4.6s; }
    .cluster-11 { left: 44%; top: 215px; animation-delay: 4.8s; }
    .cluster-12 { left: 52%; top: 210px; animation-delay: 5s; }

    .berry {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff3344, #e60012, #b30000);
      box-shadow: 
        inset -2px -3px 5px rgba(0, 0, 0, 0.4),
        0 4px 10px rgba(230, 0, 18, 0.7),
        0 2px 4px rgba(0, 0, 0, 0.3);
      animation: breathe 4s ease-in-out infinite;
    }

    .berry::after {
      content: "";
      position: absolute;
      top: 2px;
      right: 3px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      filter: blur(0.5px);
    }

    /* Kokina dalları */
    .branch {
      position: absolute;
      background: linear-gradient(to right, #4a7c2c, #5a8c3c);
      border-radius: 2px;
      z-index: 5;
      opacity: 0;
      animation: branchAppear 1s ease forwards;
    }

    @keyframes branchAppear {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .wrap {
      position: absolute;
      left: 50%;
      bottom: 60px;
      transform: translateX(-50%);
      width: 280px;
      height: 180px;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.5));
      animation: wrapAppear 2s ease-out 0.8s forwards;
      opacity: 0;
    }

    @keyframes wrapAppear {
      from { opacity: 0; transform: translateX(-50%) rotateX(-90deg); }
      to { opacity: 1; transform: translateX(-50%) rotateX(0deg); }
    }

    .wrap.red {
      background: linear-gradient(135deg, #ff3344, #ff5566, #ff4757);
      clip-path: polygon(15% 0, 85% 0, 70% 100%, 30% 100%);
      box-shadow: inset -15px 0 30px rgba(0, 0, 0, 0.2);
    }

    .wrap.red::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 15px,
        rgba(255, 255, 255, 0.05) 15px,
        rgba(255, 255, 255, 0.05) 30px
      );
    }

    .wrap.black {
      bottom: 35px;
      width: 300px;
      height: 160px;
      background: linear-gradient(135deg, #1a1a1a, #2d2d2d, #1a1a1a);
      clip-path: polygon(20% 0, 80% 0, 65% 100%, 35% 100%);
      opacity: 0.95;
      z-index: -1;
    }

    .ribbon {
      position: absolute;
      left: 50%;
      bottom: 160px;
      transform: translateX(-50%);
      width: 160px;
      height: 30px;
      background: linear-gradient(90deg, #0d0d0d, #2d2d2d, #1a1a1a, #0d0d0d);
      border-radius: 25px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.6);
      animation: ribbonAppear 1.5s ease-out 2s forwards;
      opacity: 0;
      z-index: 5;
    }

    @keyframes ribbonAppear {
      to { opacity: 1; }
    }

    .ribbon::before,
    .ribbon::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 30px;
      height: 30px;
      background: radial-gradient(circle, #2d2d2d, #0d0d0d);
      border-radius: 50%;
      transform: translateY(-50%);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
    }

    .ribbon::before {
      left: 58px;
    }

    .ribbon::after {
      right: 58px;
    }

    .ribbon-tail {
      position: absolute;
      width: 18px;
      height: 90px;
      background: linear-gradient(to bottom, #2d2d2d, #1a1a1a, #0d0d0d);
      bottom: 130px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.5);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      z-index: 5;
    }

    .ribbon-tail.left {
      left: calc(50% - 30px);
      transform: rotate(-12deg);
    }

    .ribbon-tail.right {
      right: calc(50% - 30px);
      transform: rotate(12deg);
    }

    .butterfly {
      position: absolute;
      width: 50px;
      height: 35px;
      top: 100px;
      left: 80%;
      animation: butterflyFly 12s infinite ease-in-out;
      z-index: 100;
    }

    .butterfly-wing {
      position: absolute;
      width: 22px;
      height: 30px;
      background: linear-gradient(135deg, #ff6b9d, #ff3366);
      border-radius: 50% 50% 50% 10%;
      box-shadow: 0 3px 10px rgba(255, 51, 102, 0.6);
    }

    .butterfly-wing::before,
    .butterfly-wing::after {
      content: '';
      position: absolute;
      width: 5px;
      height: 5px;
      background: #000;
      border-radius: 50%;
    }

    .butterfly-wing.left::before {
      top: 8px;
      left: 6px;
    }

    .butterfly-wing.left::after {
      top: 16px;
      left: 10px;
    }

    .butterfly-wing.right::before {
      top: 8px;
      right: 6px;
    }

    .butterfly-wing.right::after {
      top: 16px;
      right: 10px;
    }

    .butterfly-wing.left {
      left: 8px;
      animation: wingFlap 0.4s infinite;
      transform-origin: right center;
    }

    .butterfly-wing.right {
      right: 8px;
      animation: wingFlap 0.4s infinite;
      transform-origin: left center;
      transform: scaleX(-1);
    }

    @keyframes wingFlap {
      0%, 100% { transform: rotateY(0deg); }
      50% { transform: rotateY(60deg); }
    }

    .butterfly-body {
      position: absolute;
      width: 5px;
      height: 32px;
      background: #1a0f0f;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 2.5px;
    }

    @keyframes butterflyFly {
      0%, 100% { top: 100px; left: 80%; }
      25% { top: 150px; left: 20%; }
      50% { top: 120px; left: 10%; }
      75% { top: 180px; left: 50%; }
    }

    .message {
      position: absolute;
      bottom: -100px;
      width: 100%;
      text-align: center;
      opacity: 0;
      animation: fadeUp 2.5s ease forwards;
      animation-delay: 5.5s;
    }

    .message p {
      margin: 8px 0;
      font-size: 1.1rem;
      opacity: 0.9;
      line-height: 1.6;
    }

    .message strong {
      font-size: 1.6rem;
      color: #ff6b9d;
      font-weight: 600;
      display: block;
      margin-top: 10px;
      text-shadow: 0 2px 10px rgba(255, 107, 157, 0.6);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.6);
    }

    @media (max-width: 768px) {
      .scene { width: 350px; height: 550px; }
      .title h1 { font-size: 1.6rem; }
      .title p { font-size: 1rem; }
    }
  </style>
</head>

  <script>
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 150; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      starsContainer.appendChild(star);
    }

    document.body.addEventListener('click', (e) => {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = e.clientX + 'px';
      heart.style.top = e.clientY + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 2000);
    });
